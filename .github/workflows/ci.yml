name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  repository-projects: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      actions: read
      repository-projects: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Project Setup
        run: ./scripts/setup.sh

      - name: Run Linting
        run: uv run ruff check .

      - name: Run Tests with Coverage
        run: uv run pytest -rs --cov=packages/dsl/src/pdum/dsl --cov=packages/tensorlib/src/pdum/tl --cov-report=xml --cov-report=term
      - name: Build Documentation
        run: uv run mkdocs build

      - name: Execute notebooks (rot guard)
        run: uv run jupyter nbconvert --to notebook --execute --stdout packages/tensorlib/notebooks/*.ipynb docs/design/*.ipynb > /dev/null

      - name: Workspace members — build + isolated install (migration P0 gate)
        run: |
          rm -rf dist-members
          uv build --package habemus-papadum-dsl -o dist-members
          uv build --package habemus-papadum-tl  -o dist-members
          uv venv /tmp/members-check
          uv pip install --python /tmp/members-check/bin/python dist-members/*.whl
          /tmp/members-check/bin/python -c "import pdum.dsl, pdum.tl; print('members OK:', pdum.dsl.__version__)"
      - name: Temporarily disable git hooks for coverage action
        run: |
          if [ -f .git/hooks/pre-commit ]; then
            mv .git/hooks/pre-commit .git/hooks/pre-commit.disabled
          fi

      - name: Coverage Comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

      - name: Re-enable git hooks
        if: always()
        run: |
          if [ -f .git/hooks/pre-commit.disabled ]; then
            mv .git/hooks/pre-commit.disabled .git/hooks/pre-commit
          fi

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  # The framework CHECK/BASELINE columns on CPU wheels (310): substrate
  # correctness gates like any conformance — a dialect-semantics regression
  # that breaks torch/jax agreement must be visible here, not only on a GPU
  # box. The cuda halves of the batteries skip on hosted runners and light
  # up unchanged the day a GPU worker exists.
  conformance-frameworks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run the framework batteries (CPU wheels)
        run: >
          uv run --frozen --group torch-cpu --group jax-cpu pytest -rs
          conformance/test_torch_zoo.py
          conformance/test_jax_zoo.py
          conformance/test_torch_baselines.py
          conformance/test_jax_baselines.py
          conformance/test_f32_columns.py
          conformance/test_tile_columns.py
