# The coverage ledger (290 §2, owner-ratified 2026-07-28).
#
# Two gap kinds get two treatments: never-legal constructs REFUSE at the tier
# (check_tier, dialect.py); legal-but-not-yet-translatable constructs live
# HERE — visible, versioned, machine-checked. conformance/test_ledger.py
# drifts this file against reality in BOTH directions: a vocabulary op with
# neither a device row nor a ledger row fails, and a ledgered op that has
# GAINED a device row fails too (coverage progress is recorded, not just
# regressions). Facet rows are finer than an op; each names the test that
# guards it, and a row whose guard does not exist is itself a failure.
#
# Bump `version` on any row change; conformance skips quote their row.

version = 1

